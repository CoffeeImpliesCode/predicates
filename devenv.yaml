# devenv input pin for the predicates SDK.
#
# The nixpkgs channel is pinned by revision so that a shell is reproducible from
# the lock. The matching flake input lives in flake.nix and is pinned
# independently, because the two entry points resolve in different contexts.
#
# devenv.lock is not written here: the driver owns locks.
#
# SPDX-License-Identifier: LicenseRef-PublicDomain
inputs:
  nixpkgs:
    url: "github:cachix/devenv-nixpkgs/c2f38fe7f9e04d9aadd354d380f2bd40531d9737"