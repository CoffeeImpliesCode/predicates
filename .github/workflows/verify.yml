# Verification for this fork.
#
# The canonical distribution ships no CI, so there was no upstream workflow to
# retarget: this file is written for this repository and names this
# repository's gates.
#
# Four jobs, four different questions:
#   provenance  does src/predicates.c hash to the digest UPSTREAM.md records,
#               and is the public domain notice still present in the source,
#               the notice file and the README
#   native      does it build, does the public C header compile, link and run
#               against the installed archive, do the tests pass and does the
#               example produce its output on this host
#   cross       does it compile and link for the supported target matrix, and does
#               the one unsupported target still fail for the documented reason
#   consumer    does the published module resolve from a package that did not
#               write it
#
# There is no source-text job. An earlier revision compared declaration names
# between include/predicates.h and src/predicates.c; that is a name-set
# comparison, which a reindentation or a retyped declaration defeats, and it
# never proved that a consumer could call the header. The header is covered by
# compiling and linking against it instead.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    name: source provenance and licence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: upstream source checksum
        run: |
          set -euo pipefail
          expected=$(grep -oE '[0-9a-f]{64}' UPSTREAM.md | head -1)
          if [ -z "$expected" ]; then
            echo "UPSTREAM.md records no checksum to compare against" >&2
            exit 1
          fi
          actual=$(sha256sum src/predicates.c | cut -d' ' -f1)
          if [ "$expected" != "$actual" ]; then
            echo "src/predicates.c is not the file UPSTREAM.md records" >&2
            echo "  expected $expected" >&2
            echo "  actual   $actual" >&2
            echo "If this is an intentional re-sync, update UPSTREAM.md," >&2
            echo "NOTICE.md and CHANGELOG.md in the same commit." >&2
            exit 1
          fi
          echo "src/predicates.c matches the recorded upstream checksum"

      - name: public domain notice
        run: |
          set -euo pipefail
          # The grant lives in the C file's own header. It has to survive in
          # this file, and it has to be reproduced somewhere a reader will
          # find without opening C source.
          grep -q "Placed in the public domain by" src/predicates.c
          grep -q "Placed in the public domain by" NOTICE.md
          grep -q "Public domain" README.md
          echo "the public domain notice is present in the source, the notice and the readme"

      # This job deliberately does not compare declaration names between
      # include/predicates.h and src/predicates.c. A name-set comparison is a
      # source-text test: it fails when a line is reindented and passes when a
      # declaration is retyped, and it is not evidence that a consumer can call
      # the header. The header's real coverage is the compile-and-link gate in
      # the native job, which calls every routine the header declares.

  native:
    name: native build, tests and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: build
        run: zig build

      # A real gate for the public C surface, and the replacement for the
      # declaration-name comparison that used to sit in the provenance job.
      # This translation unit includes the installed header, calls every
      # routine and reads every global that header declares, then links
      # against the installed archive. A declaration whose type is wrong fails
      # to compile; a declaration the archive does not define fails to link.
      # The program runs, and asserts the one result that is certain by hand.
      - name: public C header compiles, links and runs
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/c_surface_gate.c" <<'C'
          #include <predicates.h>
          #include <stdio.h>

          /* volatile so no optimizer can delete a call: the compile and the
             link are the assertions, not the values. */
          static volatile double sink;

          int main(void) {
              double a[2] = { 0.0, 0.0 };
              double b[2] = { 1.0, 0.0 };
              double c[2] = { 0.0, 1.0 };
              double dd[2] = { 0.0, 0.0 };
              double p[3] = { 0.0, 0.0, 0.0 };
              double q[3] = { 1.0, 0.0, 0.0 };
              double r[3] = { 0.0, 1.0, 0.0 };
              double s[3] = { 0.0, 0.0, 1.0 };
              double t[3] = { 0.0, 0.0, 0.5 };
              double one[1] = { 1.0 };
              double two[2] = { 0.0, 1.0 };
              double h[8];
              double g[8];

              exactinit();

              /* The one asserted result: counterclockwise is positive. */
              if (orient2d(a, b, c) <= 0.0) return 1;

              sink = orient2dfast(a, b, c);
              sink = orient2dexact(a, b, c);
              sink = orient2dslow(a, b, c);
              sink = orient2dadapt(a, b, c, 1.0);

              sink = orient3dfast(p, q, r, s);
              sink = orient3dexact(p, q, r, s);
              sink = orient3dslow(p, q, r, s);
              sink = orient3dadapt(p, q, r, s, 1.0);
              sink = orient3d(p, q, r, t);

              sink = incirclefast(b, c, dd, a);
              sink = incircleexact(b, c, dd, a);
              sink = incircleslow(b, c, dd, a);
              sink = incircleadapt(b, c, dd, a, 1.0);
              sink = incircle(b, c, dd, a);

              sink = inspherefast(q, r, s, p, t);
              sink = insphereexact(q, r, s, p, t);
              sink = insphereslow(q, r, s, p, t);
              sink = insphereadapt(q, r, s, p, t, 1.0);
              sink = insphere(q, r, s, p, t);

              sink = (double)grow_expansion(1, one, 0.5, h);
              sink = (double)grow_expansion_zeroelim(1, one, 0.5, h);
              sink = (double)expansion_sum(1, one, 1, one, h);
              sink = (double)expansion_sum_zeroelim1(1, one, 1, one, h);
              sink = (double)expansion_sum_zeroelim2(1, one, 1, one, h);
              sink = (double)fast_expansion_sum(1, one, 1, one, h);
              sink = (double)fast_expansion_sum_zeroelim(1, one, 1, one, h);
              sink = (double)linear_expansion_sum(1, one, 1, one, h);
              sink = (double)linear_expansion_sum_zeroelim(1, one, 1, one, h);
              sink = (double)scale_expansion(1, one, 2.0, g);
              sink = (double)scale_expansion_zeroelim(1, one, 2.0, g);
              sink = (double)compress(2, two, h);
              sink = estimate(1, one);

              sink = doublerand();
              sink = narrowdoublerand();
              sink = uniformdoublerand();
              sink = floatrand();
              sink = narrowfloatrand();
              sink = uniformfloatrand();

              sink = splitter + epsilon + resulterrbound + ccwerrboundA +
                     ccwerrboundB + ccwerrboundC + o3derrboundA + o3derrboundB +
                     o3derrboundC + iccerrboundA + iccerrboundB + iccerrboundC +
                     isperrboundA + isperrboundB + isperrboundC;

              printf("public C surface compiled, linked and ran\n");
              return 0;
          }
          C
          # The same flags the library itself is compiled with. The header
          # states them as requirements, so a consumer that ignores them gets
          # a valid build and a wrong sign; this gate uses them.
          zig cc -std=gnu17 -ffp-contract=off -fno-fast-math \
            -I zig-out/include \
            "$RUNNER_TEMP/c_surface_gate.c" \
            zig-out/lib/libpredicates.a \
            -o "$RUNNER_TEMP/c_surface_gate"
          "$RUNNER_TEMP/c_surface_gate"

      # Debug and ReleaseSafe are the two modes where std.debug.assert is live,
      # so they are the two modes where the facade's initialization guard can
      # actually catch a caller that skipped init().
      - name: test (Debug)
        run: zig build test

      - name: test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe

      - name: smoke
        run: zig build smoke

  cross:
    name: check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - aarch64-macos-none
          - x86_64-windows-gnu
          - riscv64-linux-gnu
          - wasm32-wasi
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Compile the full library and public API
        # Canonical predicates.c requires POSIX random(), absent on Windows.
        # Keep the failed attempt visible; this does not claim Windows support.
        continue-on-error: ${{ matrix.target == 'x86_64-windows-gnu' }}
        run: zig build check -Dtarget=${{ matrix.target }} --summary all

  consumer:
    name: consumer package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The failure this catches is the one the library's own tests cannot see:
      # a module that builds from the inside and does not resolve from outside.
      - name: run
        working-directory: consumer
        run: zig build run