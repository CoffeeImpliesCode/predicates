# Verification for this fork.
#
# The canonical distribution ships no CI, so there was no upstream workflow to
# retarget: this file is written for this repository and names this
# repository's gates.
#
# Six jobs, six different questions:
#   provenance  does src/predicates.c hash to the digest UPSTREAM.md records,
#               is the public domain notice still present in the source, the
#               notice file and the README, and does every carried upstream
#               byte still match UPSTREAM-BASELINE.sha256 with nothing carried
#               outside that baseline
#   native      does it build, does the public C header compile, link and run
#               against the installed archive, do the tests pass and does the
#               example produce its output on this host
#   shared      is the `-Dlinkage=dynamic` variant a real shared object: built
#               position-independent, exporting the whole declared C surface,
#               with recorded dynamic dependencies and link metadata
#   runtime     does `-Druntime=true` configure and compile the dispatch route,
#               and still produce the artifact a loader would open
#   cross       does it compile and link for the supported target matrix, and does
#               the one unsupported target still fail for the documented reason
#   consumer    does the published module resolve from a package that did not
#               write it
#
# There is no source-text job. An earlier revision compared declaration names
# between include/predicates.h and src/predicates.c; that is a name-set
# comparison, which a reindentation or a retyped declaration defeats, and it
# never proved that a consumer could call the header. The header is covered by
# compiling and linking against it instead.
#
# Every build that installs names its own `--prefix`, under `$RUNNER_TEMP`, the
# per-job scratch directory this file already writes its generated C programs to.
# A bare `zig build` runs the install step, so an unprefixed install writes
# `zig-out/` into the checked-out workspace, and two jobs sharing one path would
# overwrite each other's installed closure. `test`, `smoke`, `check` and the
# consumer's `run` depend on no install step, so they pass no prefix.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    name: source provenance and licence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The checksum, the public-domain notice and the per-file baseline are
      # one script, and CI runs the script rather than a second copy of its
      # checks. A second copy would be free to drift from the file it mirrors,
      # and nothing in this job would detect the drift.
      - name: upstream checksum, public domain notice and the upstream baseline
        run: tools/check-provenance.sh

      # This job deliberately does not compare declaration names between
      # include/predicates.h and src/predicates.c. A name-set comparison is a
      # source-text test: it fails when a line is reindented and passes when a
      # declaration is retyped, and it is not evidence that a consumer can call
      # the header. The header's real coverage is the compile-and-link gate in
      # the native job, which calls every routine the header declares.

  native:
    name: native build, tests and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: build
        run: zig build --prefix "$RUNNER_TEMP/static"

      # A real gate for the public C surface, and the replacement for the
      # declaration-name comparison that used to sit in the provenance job.
      # `tools/c_surface_gate.c` includes the installed header, calls every
      # routine and reads every global that header declares, then links against
      # the installed archive. A declaration whose type is wrong fails to
      # compile; a declaration the archive does not define fails to link. The
      # program runs, and asserts the one result that is certain by hand.
      #
      # The same program is the gate for the shared variant, linked against
      # `libpredicates.so` in the `shared` job below. It is one file rather than
      # one file per linkage, because two copies of this program would be two
      # definitions of one gate and they would drift.
      - name: public C header compiles, links and runs
        run: |
          set -euo pipefail
          # The same flags the library itself is compiled with. The header
          # states them as requirements, so a consumer that ignores them gets
          # a valid build and a wrong sign; this gate uses them.
          zig cc -std=gnu17 -ffp-contract=off -fno-fast-math \
            -I "$RUNNER_TEMP/static/include" \
            tools/c_surface_gate.c \
            "$RUNNER_TEMP/static/lib/libpredicates.a" \
            -o "$RUNNER_TEMP/c_surface_gate"
          "$RUNNER_TEMP/c_surface_gate"

      # These jobs exercise the facade in Debug and ReleaseSafe. Its ordinary
      # initialization comparison and panic also remain live in ReleaseFast
      # and ReleaseSmall; those modes have no additional CI jobs here.
      - name: test (Debug)
        run: zig build test

      - name: test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe

      - name: smoke
        run: zig build smoke

  # The second delivery variant. It exists because `-Dlinkage=dynamic` is a
  # claim this fork makes about the artifact, and a claim about an artifact
  # needs an artifact to be made about.
  #
  # Three separate things are checked, because a file with a `.so` name can
  # fail any of them while still looking like a shared library:
  #
  #   * it is a shared object at all, and not an archive renamed;
  #   * it was compiled position-independently. TEXTREL is the failure that
  #     matters: a non-PIC object the linker had to load-fix up says so by
  #     asking for writable text, and a loader that maps it read-only refuses
  #     it;
  #   * every declared function and global is reachable through its dynamic
  #     export table, which is what the C consumer below proves.
  #
  # That last point is not asserted from a name list.
  # `tools/c_surface_gate.c` calls all forty routines and reads all fifteen
  # globals `include/predicates.h` declares, so linking it against this object
  # fails if any one of the fifty-five is missing from the export table — which
  # is the same gate the static job runs against the archive.
  shared:
    name: "shared object: PIC, export surface, and a C consumer"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # A scratch prefix, as the native job above uses: `-Dlinkage=dynamic` is
      # still the default step and still installs, and its closure is read
      # below rather than from the tree.
      - name: build
        run: zig build -Dlinkage=dynamic --prefix "$RUNNER_TEMP/shared"

      - name: the artifact is a shared object, built PIC, with no text relocations
        run: |
          set -euo pipefail
          so="$RUNNER_TEMP/shared/lib/libpredicates.so"
          if [ ! -f "$so" ]; then
            echo "-Dlinkage=dynamic did not install $so" >&2
            exit 1
          fi
          readelf -h "$so" | grep -E 'Type:[[:space:]]+DYN' \
            || { echo "$so is not an ET_DYN object" >&2; readelf -h "$so" >&2; exit 1; }
          if readelf -d "$so" | grep -q 'TEXTREL'; then
            echo "$so carries TEXTREL: it was not built position-independent" >&2
            readelf -d "$so" >&2
            exit 1
          fi
          echo "shared object, position-independent, no text relocations"

      - name: its dynamic dependencies are recorded
        run: |
          set -euo pipefail
          # `src/predicates.c` calls POSIX random(), so a libc entry is a real
          # dependency of this artifact and has to be visible in DT_NEEDED. A
          # shared object with an empty dynamic section is a file with a
          # library's name and none of its behaviour.
          readelf -d "$RUNNER_TEMP/shared/lib/libpredicates.so" | grep -E 'NEEDED' \
            || { echo "DT_NEEDED is empty: no dependency was recorded" >&2; exit 1; }
          readelf -d "$RUNNER_TEMP/shared/lib/libpredicates.so" | grep -E 'NEEDED|SONAME' || true

      - name: the whole declared C surface is exported and runs through it
        run: |
          set -euo pipefail
          zig cc -std=gnu17 -ffp-contract=off -fno-fast-math \
            -I "$RUNNER_TEMP/shared/include" \
            tools/c_surface_gate.c \
            -L "$RUNNER_TEMP/shared/lib" -lpredicates \
            -Wl,-rpath,"$RUNNER_TEMP/shared/lib" \
            -o "$RUNNER_TEMP/c_surface_gate_shared"
          "$RUNNER_TEMP/c_surface_gate_shared"

      - name: pkg-config metadata answers for the installed prefix
        run: |
          set -euo pipefail
          pc="$RUNNER_TEMP/shared/lib/pkgconfig/predicates.pc"
          if [ ! -f "$pc" ]; then
            echo "no pkg-config metadata at $pc" >&2
            exit 1
          fi
          export PKG_CONFIG_PATH="$RUNNER_TEMP/shared/lib/pkgconfig"
          # The `pcfiledir`-relative prefix is what makes these answers correct
          # for the scratch prefix this job installed into and for a Nix $out
          # alike; a hardcoded /usr/local would be right for neither.
          cflags=$(pkg-config --cflags predicates)
          libs=$(pkg-config --libs predicates)
          case "$cflags" in
            *"$RUNNER_TEMP/shared/include"*) ;;
            *) echo "unexpected Cflags: $cflags" >&2; exit 1;;
          esac
          case "$libs" in
            *-lpredicates*) ;;
            *) echo "unexpected Libs: $libs" >&2; exit 1;;
          esac
          echo "Cflags: $cflags"
          echo "Libs:   $libs"

  # The runtime-loading configuration. It exists so that `-Druntime=true` is a
  # configuration with a gate rather than a flag nobody ever turns: this job
  # proves the graph configures, that the dispatch route compiles against the
  # facade, and — the point of the whole option — that the native artifact is
  # still produced, because a loader has nothing to load without a provider.
  #
  # What it deliberately does not do is claim a loaded consumer ran. Startup,
  # failure, retry, idempotence, provider change and the pre-publication panic
  # in every optimize mode are behavioural questions about the API role's tests
  # and the loader core, and no assertion about them belongs in a job that only
  # builds. Nothing here creates, stubs or substitutes any runtime file: if
  # `runtime/loader.zig`, `runtime/sync.c`, `runtime/sync.h` or
  # `runtime/generate.zig` is absent, this job fails with the compiler's own
  # FileNotFound, which is the correct report.
  runtime:
    name: runtime-loading route compiles and still installs the provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Each of the three configurations below installs, so each names its own
      # scratch prefix. They would otherwise share one tree and a later
      # configuration's install would land on top of the one the step after it
      # is about to read.
      - name: build
        run: zig build -Druntime=true -Dlinkage=dynamic --prefix "$RUNNER_TEMP/runtime-dynamic" --summary all

      - name: the provider the loader would open is still installed
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/runtime-dynamic/lib/libpredicates.so" ]; then
            echo "-Druntime=true did not install the artifact it built" >&2
            exit 1
          fi

      - name: the linked configuration still builds
        run: zig build --prefix "$RUNNER_TEMP/linked" --summary all

      - name: the two options are independent
        # -Druntime=true with a static artifact is a real configuration: the
        # facade resolves through the table while the build still produces an
        # archive. Refusing the combination would be a rule this graph has no
        # basis for, and silently turning it into a linked build would be worse.
        run: zig build -Druntime=true -Dlinkage=static --prefix "$RUNNER_TEMP/runtime-static" --summary all

  cross:
    name: check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - aarch64-macos-none
          - x86_64-windows-gnu
          - riscv64-linux-gnu
          - wasm32-wasi
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Compile the full library and public API
        # Canonical predicates.c requires POSIX random(), absent on Windows.
        # Keep the failed attempt visible; this does not claim Windows support.
        continue-on-error: ${{ matrix.target == 'x86_64-windows-gnu' }}
        run: zig build check -Dtarget=${{ matrix.target }} --summary all

  consumer:
    name: consumer package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The failure this catches is the one the library's own tests cannot see:
      # a module that builds from the inside and does not resolve from outside.
      - name: run
        working-directory: consumer
        run: zig build run